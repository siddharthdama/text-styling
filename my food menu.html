<!DOCTYPE html>
<html>
<head>
  <title>My Superhero Card</title>
  <style>

    /* Typography — font, size, weight, colour for the whole page */
    body {
      background-color: darkblue;
      color: white;
      font-family: Arial, sans-serif;
    }

    /* Typography + Text Shadow — big bold title with an orange shadow */
    .hero-name {
      font-size: 60px;
      font-weight: bold;
      color: yellow;
      text-shadow: 3px 3px orange;
    }

    /* Typography + Text Transform — tagline becomes Title Case */
    .tagline {
      font-style: italic;
      color: lightblue;
      text-transform: capitalize;
    }

    /* Text Transform + Text Decoration — section headings in CAPS with underline */
    .label {
      text-transform: uppercase;
      text-decoration: underline;
      color: coral;
    }

    /* Typography — powers stand out in bold green */
    .power {
      font-weight: bold;
      color: lightgreen;
    }

/* Text Decoration — weaknesses are crossed out */
    .weakness {
      text-decoration: line-through;
      color: gray;
    }
    .badge {
      font-size: 28px;
      font-weight: bold;
      color: gold;
      transform: rotate(15deg);
    }
    .made-by {
      color: coral;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1 class="food-name">My Food Menu</h1>
  <p class="tagline"> my menu</p>
  <h2 class="label">specials</h2>
  <p class="power">Spicy Tofu Stir Fry</p>
  <p class="power">Vegetable Lasagna</p>
  <h2 class="label">Chef's Favorites</h2>
  <p class="chef-favorite">Spicy Tofu Stir Fry</p>
  <p class="chef-favorite">Vegetable Lasagna</p>
  <p class="badge">the only five star restaurant in state</p>
  <p class="made-by">Created by SIDDHARTH</p>
</body>
</html>
